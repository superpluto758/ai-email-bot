services:
  email-bot:
    image: python:3.12-slim
    container_name: email-bot
    restart: unless-stopped

    environment:
      # ---- mailbox (required) ---------------------------------------------
      # The address the assistant reads from and replies as.
      MAIL_ADDRESS: "[user email to use as bot]"
      # An app-specific password, not your normal account password. Most
      # providers require one for IMAP; spaces and invisible characters are
      # stripped automatically, so paste it exactly as given.
      MAIL_PASSWORD: "[app password for that mailbox]"

      # Your provider's IMAP and SMTP hosts. Examples:
      #   Fastmail:   imap.fastmail.com  / smtp.fastmail.com
      #   Zoho (EU):  imap.zoho.eu       / smtp.zoho.eu
      #   Zoho (com): imap.zoho.com      / smtp.zoho.com
      #   Gmail:      imap.gmail.com     / smtp.gmail.com   (see README warning)
      IMAP_HOST: "imap.example.com"
      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: "465"

      # ---- Claude API (required) ------------------------------------------
      ANTHROPIC_API_KEY: "[your anthropic api key]"

      # ---- who can use it (required) --------------------------------------
      # Owners. Only these can change settings by email. Deliberately NOT
      # editable by email, because a From address can be forged.
      ADMIN_ADDRESSES: "[your email],[your other email]"

      # Who gets answered at all. Leave unset to default to the admins.
      ALLOWLIST: "[your email],[a friend's email]"

      # The smaller set allowed to send attachments. Anyone else who attaches a
      # file has the whole message declined unread. Defaults to the admins.
      FILE_ALLOWLIST: "[your email]"

      # ---- alerts and notifications (optional) ----------------------------
      # Where flag alerts, policy alerts and scheduled reports go. Defaults to
      # the admins.
      ALERT_ADDRESSES: "[your email]"

      # Admin addresses that are NEVER emailed unless they wrote first. They
      # keep full admin powers - they can ask for anything and get an answer -
      # but no alert or report is ever pushed to them. Worth using for a work
      # or school account, where unsolicited automated mail is unwelcome and
      # usually filtered as spam by the gateway anyway.
      NEVER_UNPROMPTED_ADDRESSES: ""

      # Senders ignored completely: never read by the model, never classified,
      # answered, counted or labelled - just left in the mailbox for you. Meant
      # for machine reports such as DMARC aggregates.
      IGNORE_SENDERS: "noreply-dmarc-support@google.com"

      # ---- behaviour (optional) -------------------------------------------
      FROM_NAME: "AI Assistant"       # display name on replies
      TZ: "Europe/London"
      STATE_PATH: "/data/state.json"

      # Some containers default to ASCII, which mangles pound signs, accents
      # and non-Latin scripts on the way out.
      PYTHONUTF8: "1"
      LANG: "C.UTF-8"

      # How many waiting messages to pull in one pass. Each is fetched whole,
      # attachments and all, so a long backlog can be a lot of memory at once.
      # Keep mem_limit comfortably above this times your largest message.
      MAX_BATCH: "20"

      # If a full cycle makes no progress for this long, the bot saves state and
      # exits non-zero so restart:unless-stopped can restart it. A healthcheck
      # cannot do this - Docker marks a container unhealthy without restarting
      # it. "0" disables the watchdog.
      WATCHDOG_SECONDS: "1800"

      # Abuse safety. Repeatedly retrying a rejected login looks like
      # credential stuffing and can get a mailbox suspended, so the bot stops
      # instead. The send caps should sit below your provider's own limit.
      AUTH_FAIL_LIMIT: "5"
      MAX_SENDS_PER_HOUR: "20"
      MAX_SENDS_PER_DAY: "80"

      # Random delay before replying, so traffic is not machine-timed.
      REPLY_DELAY_MIN: "5"
      REPLY_DELAY_MAX: "25"

      # ---- limits, reports and analytics ----------------------------------
      # Replies per person per day for everyone who is not an owner. Admins
      # are always unlimited. Individual people can be given their own limit
      # by email; "0" means no limit for anyone.
      PER_USER_DAILY_LIMIT: "30"

      # Scheduled summaries to the alert addresses. The weekly one doubles as a
      # heartbeat: if it stops arriving, the bot or its machine is down.
      WEEKLY_REPORT_DAYS: "7"         # "0" disables
      MONTHLY_REPORT: "1"             # month-end summary; "0" disables
      YEARLY_REPORT: "1"              # year-end cost summary; "0" disables

      # Reports are shown in your currency. Anthropic bills in USD; this is a
      # fixed rate, not a live lookup.
      USD_TO_GBP: "0.79"
      CURRENCY_SYMBOL: "£"

      # ---- model routing ---------------------------------------------------
      # The model used for anything that is not obviously trivial or simple.
      MODEL: "claude-opus-5"

      # Short, plain questions are routed to cheaper models automatically.
      # This is a free length-and-shape heuristic, not an extra API call.
      # Set either model to "" to switch that tier off.
      TRIVIAL_MODEL: "claude-haiku-4-5"
      TRIVIAL_MAX_CHARS: "60"
      SIMPLE_MODEL: "claude-sonnet-5"
      SIMPLE_MAX_CHARS: "350"

      # Remembering people between conversations. Notes are written by the
      # model as part of its normal reply, so this costs no extra API calls,
      # and they are stored alongside the allowlist in the state file.
      MEMORY_ENABLED: "1"             # "0" remembers nothing
      MEMORY_MAX_CHARS: "1200"
      # Longest single note the model may store about one person. Notes go in
      # the user turn, not the system prompt, so they can never act as a
      # standing instruction - this just stops one growing into an essay.
      MEMORY_NOTE_MAX_CHARS: "200"

      # Backstop on a day's API spend, in USD. Once it trips, allowlisted mail
      # is HELD (answered when the day rolls over, never lost) and strangers are
      # flagged without costing a call. Admins are never held by it. 0 disables.
      DAILY_SPEND_CAP_USD: "10"
      # A 429 or a 5xx is the API having a moment, not a bad message: it is
      # retried, then the message is held for a later pass rather than being
      # blamed and abandoned.
      API_RETRIES: "2"
      MAX_TRANSIENT_HOLDS: "8"
      # Model that triages strangers. Empty means "the main model", which is the
      # safe default - judging a real person to be a machine is the one mistake
      # this must not make. claude-sonnet-5 is much cheaper if you want it.
      TRIAGE_MODEL: ""

    # Give the SIGTERM handler time to save before Docker resorts to SIGKILL.
    stop_grace_period: 30s

    # A ceiling, so a large backlog cannot take the host down with it. The bot
    # idles around 25 MB.
    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Visibility only: Docker marks an unhealthy container but does not restart
    # it. The real protection against a wedged process is the watchdog inside
    # bot.py, which exits non-zero so restart:unless-stopped can do its job.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,time,sys;
          s=json.load(open('/data/state.json'));
          sys.exit(0 if time.time()-s.get('last_active',0) < 3600 else 1)"
      interval: 5m
      timeout: 20s
      retries: 3
      start_period: 3m

    volumes:
      - ./bot.py:/app/bot.py:ro
      - ./data:/data           # allowlist, usage counts and state live here

    command:
      - sh
      - -c
      - |
        set -e
        pip install --quiet --no-cache-dir 'imapclient==3.1.0'
        exec python -u /app/bot.py
